apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: acme/orders:1.0
          ports:
            - containerPort: 9090
          env:
            - name: DATABASE_URL
              value: "postgres://orders@orders-db:5432/orders"
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - port: 9090
      targetPort: 9090
