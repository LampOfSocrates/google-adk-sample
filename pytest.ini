[pytest]
# auto = async test functions run without needing an explicit decorator
asyncio_mode = auto
markers =
    live: hits a real LLM. Skip with -m "not live". Pick the backend with --backend gemini|openai|deepseek|bedrock (default gemini; needs that backend's key in .env), e.g. pytest -m live --backend deepseek
    unit: pure logic, no agent runner. Auto-applied to tests under a tests/<usecase>/unit/ folder.
    integration: agent + tools/stores via InMemoryRunner on the mock backend (offline). Auto-applied under tests/<usecase>/integration/.
    e2e: full path against a real LLM; equivalent to `live`. Auto-applied under tests/<usecase>/e2e/.
filterwarnings =
    # We knowingly use SequentialAgent (clearer than the graph Workflow for a fixed pipeline).
    ignore:SequentialAgent is deprecated:DeprecationWarning
